<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="45%" stop-color="#022c22" />
      <stop offset="80%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="pitchStripes" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="10%" stop-color="#000000" stop-opacity="0.03" />
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="30%" stop-color="#000000" stop-opacity="0.03" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="50%" stop-color="#000000" stop-opacity="0.03" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="70%" stop-color="#000000" stop-opacity="0.03" />
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="90%" stop-color="#000000" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
    <radialGradient id="floodlightLeft" cx="15%" cy="10%" r="65%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="floodlightRight" cx="85%" cy="10%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="1200" height="400" fill="url(#bg)" />

  <!-- Field Grass Cut Stripes -->
  <rect width="1200" height="400" fill="url(#pitchStripes)" />

  <!-- Lighting glow -->
  <rect width="1200" height="400" fill="url(#floodlightLeft)" />
  <rect width="1200" height="400" fill="url(#floodlightRight)" />

  <!-- Pitch Line Markings -->
  <g stroke="#ffffff" stroke-width="2.5" opacity="0.18" fill="none">
    <!-- Center line -->
    <line x1="600" y1="0" x2="600" y2="400" stroke-dasharray="10 6" />
    <!-- Center circle -->
    <circle cx="600" cy="200" r="140" />
    <circle cx="600" cy="200" r="4" fill="#ffffff" />
    <!-- Touchlines & Boxes -->
    <rect x="20" y="20" width="1160" height="360" rx="12" />
    <!-- Left penalty box -->
    <path d="M 20 100 L 160 100 L 160 300 L 20 300" />
    <!-- Right penalty box -->
    <path d="M 1180 100 L 1040 100 L 1040 300 L 1180 300" />
    <!-- Corner arcs -->
    <path d="M 20 50 A 30 30 0 0 1 50 20" />
    <path d="M 1150 20 A 30 30 0 0 1 1180 50" />
    <path d="M 20 350 A 30 30 0 0 0 50 380" />
    <path d="M 1150 380 A 30 30 0 0 0 1180 350" />
  </g>

  <!-- Stadium Floodlights Glow Effect -->
  <circle cx="100" cy="40" r="8" fill="#ffffff" filter="url(#glow)" opacity="0.8" />
  <circle cx="1100" cy="40" r="8" fill="#ffffff" filter="url(#glow)" opacity="0.8" />

  <!-- Emblem / Badge Center Glow -->
  <g transform="translate(600, 155)">
    <!-- Shield Outline -->
    <path d="M 0 -75 L 55 -55 C 55 10 35 60 0 80 C -35 60 -55 10 -55 -55 Z" 
          fill="#0f172a" stroke="#10b981" stroke-width="4" opacity="0.85" filter="url(#glow)" />
    <!-- Inner Star / Ball -->
    <circle cx="0" cy="0" r="28" fill="#10b981" opacity="0.2" />
    <!-- Whistle Icon representation -->
    <path d="M -16 -6 C -16 -16 -6 -24 6 -24 C 18 -24 26 -16 26 -4 L 18 -4 L 14 -12 L 2 -12 L 2 4 C 2 12 -4 18 -12 18 C -20 18 -26 12 -26 4 C -26 -2 -22 -6 -16 -6 Z" 
          fill="#34d399" />
  </g>

  <!-- Typography -->
  <g text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <!-- Top kicker -->
    <text x="600" y="275" font-size="20" font-weight="800" fill="#a7f3d0" letter-spacing="8" opacity="0.9">
      MATCHDAY &amp; FAIR PLAY SQUAD
    </text>
    <!-- Subtitle / standard badge text -->
    <text x="600" y="315" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="4">
      TEAM HEADER BANNER
    </text>
    <text x="600" y="348" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="2">
      STANDARD SIZE: 1200 × 400 PX (3:1 RATIO)
    </text>
  </g>
</svg>
